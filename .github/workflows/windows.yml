name: Java JNI CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: windows-latest

    defaults:
      run:
        working-directory: lab16

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Generate JNI headers
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path native-headers
          New-Item -ItemType Directory -Force -Path target\classes
          
          javac -h native-headers -d target/classes src/main/java/ua/khpi/oop/lab16/NativeTemperatureConverter.java

      - name: Build native library
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path build\native
          
          clang++ -std=c++17 -shared -fPIC \
            -I"$env:JAVA_HOME\include" \
            -I"$env:JAVA_HOME\include\win32" \
            -Inative-headers \
            native/temperature_converter.cpp \
            -o build/native/libtemperatureconverter.dll

      - name: Run tests
        shell: pwsh
        run: mvn test